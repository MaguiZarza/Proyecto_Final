<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Operaciones</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>Registro de Operaciones</h2>

<table>
    <thead>
        <tr>
            <th>Fecha</th>
            <th>Usuario</th>
            <th>Acción</th>
            <th>Descripción</th>
        </tr>
    </thead>
    <tbody>
        {% for op in operaciones %}
            <tr>
                <td>{{ op.fecha }}</td>
                <td>{{ op.usuario|default:"Sistema" }}</td>
                <td>{{ op.accion }}</td>
                <td>{{ op.descripcion }}</td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="4">No hay operaciones registradas.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
